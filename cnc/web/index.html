<title>Nouvella X-Ray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: one cinematic stage. Top-left: chapter title over the scene. Top-right: dark glass
   view chips + layer toggles. Bottom: a video-player bar (play, chapters, time). Single look:
   bright daylight scene under dark glass controls, the same in either host theme. */
:root {
  color-scheme: dark;
  --ink: #f4f1ec;            /* text on glass */
  --ink-dim: rgba(244, 241, 236, .62);
  --glass: rgba(18, 20, 24, .62);
  --glass-hi: rgba(18, 20, 24, .80);
  --edge: rgba(255, 255, 255, .14);
  --accent: #e07a46;         /* a piece on its way in */
  --title: #1d2023;          /* chapter title, sits on the bright sky */
  --title-dim: rgba(29, 32, 35, .66);
  --bg: #cfd8df;
  --font-ui: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-ui); overflow: hidden; direction: rtl; margin: 0; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
button { font-family: inherit; }
button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---- chapter title, top-left (in RTL: inline-end) */
.chapter { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 18px); left: 22px; width: min(420px, 44vw);
  direction: rtl; text-align: right; pointer-events: none; }
.chapter .kicker { font: 600 11px/1 var(--font-data); letter-spacing: .32em; color: var(--title-dim); direction: ltr; text-align: left; }
.chapter h1 { margin: 10px 0 6px; font-weight: 800; font-size: clamp(26px, 3.4vw, 44px); line-height: 1.1; color: var(--title); text-wrap: balance; }
.chapter p { margin: 0; font-size: 14px; line-height: 1.75; color: var(--title-dim); }
.chapter .facts { margin-top: 10px; display: flex; gap: 14px; flex-wrap: wrap; font: 600 12px/1.2 var(--font-data); color: var(--title); direction: ltr; justify-content: flex-start; }
.chapter .facts span b { color: var(--accent); font-weight: 600; }
.models { margin-top: 14px; display: flex; gap: 6px; flex-wrap: wrap; pointer-events: auto; }
.model { border: 1px solid rgba(29, 32, 35, .18); background: rgba(255, 255, 255, .55); color: var(--title);
  border-radius: 999px; padding: 6px 12px; font-weight: 700; font-size: 13px; cursor: pointer; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); }
.model[aria-current="true"] { background: var(--title); color: #fff; border-color: var(--title); }

/* ---- controls, top-right */
.controls { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 16px); right: 16px; display: grid; gap: 8px; justify-items: end; max-width: min(600px, 52vw); }
.row { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; direction: ltr; }
.chip { display: inline-flex; align-items: center; gap: 7px; background: var(--glass); color: var(--ink); border: 1px solid var(--edge);
  border-radius: 999px; padding: 7px 12px; font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px); white-space: nowrap; direction: rtl; }
.chip svg { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 1.8; flex: none; }
.chip .en { font: 400 10px/1 var(--font-data); color: var(--ink-dim); direction: ltr; }
.chip:hover { background: var(--glass-hi); }
.chip[aria-pressed="true"] { background: rgba(255, 255, 255, .92); color: #15171a; border-color: #fff; }
.chip[aria-pressed="true"] .en { color: rgba(21, 23, 26, .6); }
.chip:disabled { opacity: .35; cursor: default; }
.layer i { width: 9px; height: 9px; border-radius: 3px; flex: none; }
.chip.layer[aria-pressed="true"] { background: var(--glass); color: var(--ink); border-color: var(--edge); }
.chip.layer[aria-pressed="false"] { opacity: .45; }
.chip.layer[aria-pressed="false"] i { background: transparent !important; outline: 1px solid var(--ink-dim); }

/* ---- floating labels */
.ann, .dim { left: 0; top: 0; }
.ann { display: grid; justify-items: center; pointer-events: none; transform: translateY(-50%); }
.ann .card { direction: rtl; background: var(--glass-hi); border: 1px solid var(--edge); border-radius: 8px; padding: 6px 10px;
  color: var(--ink); white-space: nowrap; backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); }
.ann .card b { display: block; font-size: 13px; font-weight: 700; line-height: 1.25; }
.ann .card small { display: block; font: 400 10px/1.35 var(--font-data); color: var(--ink-dim); direction: ltr; text-align: right; }
.ann .stem { width: 1px; height: 26px; background: rgba(255, 255, 255, .85); }
.ann .dot { width: 7px; height: 7px; border-radius: 50%; background: #fff; box-shadow: 0 0 0 3px rgba(255, 255, 255, .25); }
.dim { font: 600 12px/1 var(--font-data); color: #fff; background: var(--glass-hi); padding: 4px 7px; border-radius: 6px; pointer-events: none; direction: ltr; }

/* ---- picked piece */
#pick { position: fixed; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 112px); background: var(--glass-hi); border: 1px solid var(--edge);
  border-radius: 10px; padding: 10px 12px; max-width: min(360px, calc(100vw - 32px)); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#pick .id { font: 600 13px/1.35 var(--font-data); direction: ltr; text-align: right; overflow-wrap: anywhere; }
#pick .st { font-size: 12px; color: var(--ink-dim); }

/* ---- player bar */
.player { position: fixed; left: 16px; right: 16px; bottom: calc(env(safe-area-inset-bottom, 0px) + 14px); background: var(--glass);
  border: 1px solid var(--edge); border-radius: 14px; padding: 10px 16px 12px; backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  direction: ltr; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 16px; align-items: center; }
.player .chapters { grid-column: 2; position: relative; height: 16px; font: 600 10px/1 var(--font-data); letter-spacing: .14em; color: var(--ink-dim); }
.player .chapters span { position: absolute; top: 0; transform: translateX(-50%); white-space: nowrap; cursor: pointer; }
.player .chapters span.on { color: var(--ink); }
.player .chapters span b { color: var(--accent); font-weight: 600; margin-right: 4px; }
#play { grid-row: 1 / span 2; width: 42px; height: 42px; border-radius: 50%; border: 0; background: #fff; color: #15171a; cursor: pointer;
  display: grid; place-items: center; }
#play svg { width: 16px; height: 16px; fill: currentColor; }
.track { grid-column: 2; position: relative; height: 18px; display: grid; align-items: center; }
.track input { width: 100%; margin: 0; accent-color: #fff; }
.ticks { position: absolute; inset: 0; pointer-events: none; }
.ticks i { position: absolute; top: 3px; width: 1px; height: 12px; background: rgba(255, 255, 255, .45); }
.right { grid-row: 1 / span 2; grid-column: 3; display: flex; align-items: center; gap: 10px; }
.time { font: 600 13px/1 var(--font-data); font-variant-numeric: tabular-nums; color: var(--ink); white-space: nowrap; }
.icon { width: 34px; height: 34px; border-radius: 8px; border: 1px solid var(--edge); background: transparent; color: var(--ink); cursor: pointer; display: grid; place-items: center; }
.icon svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.backend { font: 400 10px/1 var(--font-data); color: var(--ink-dim); letter-spacing: .12em; }

#loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
#loading span { background: var(--glass-hi); padding: 10px 16px; border-radius: 10px; font-weight: 700; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; color: var(--title); }
#secCtl { display: flex; gap: 8px; align-items: center; background: var(--glass); border: 1px solid var(--edge); border-radius: 999px; padding: 6px 12px; font-size: 12px; }
#secCtl input { width: 160px; accent-color: #fff; direction: ltr; }

@media (max-width: 760px) {
  .chapter { left: 16px; right: 16px; width: auto; top: calc(env(safe-area-inset-top, 0px) + 112px); }
  .chapter p { display: none; }
  .chapter h1 { font-size: 26px; margin: 6px 0 2px; }
  .controls { left: 16px; right: 16px; max-width: none; justify-items: stretch; }
  .row { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start; scrollbar-width: none; }
  .chip .en { display: none; }
  .player { grid-template-columns: auto 1fr; }
  .right { grid-row: 3; grid-column: 1 / span 2; justify-content: space-between; }
  .player .chapters { font-size: 8px; letter-spacing: 0; }
  .player .chapters span:not(.on):not(.cur) { display: none; }
  #pick { bottom: calc(env(safe-area-inset-bottom, 0px) + 150px); }
}
</style>

<div id="stage" aria-label="نموذج 3D تفاعلي لهيكل الموديل"></div>

<section class="chapter" aria-live="polite">
  <div class="kicker" id="kicker">THE FRAME X-RAY · NOUVELLA CASA</div>
  <h1 id="stTitle">…</h1>
  <p id="stText"></p>
  <div class="facts"><span><b id="fPlaced">0</b> / <span id="fPieces">0</span> pieces</span><span id="fSize"></span></div>
  <nav class="models" id="models" aria-label="الموديلات"></nav>
</section>

<div class="controls">
  <div class="row" aria-label="أوضاع العرض">
    <button class="chip" id="mHero" type="button"><svg viewBox="0 0 24 24"><path d="M3 11l9-7 9 7v9H3z"/></svg>الواجهة <span class="en">Hero</span></button>
    <button class="chip" id="mSection" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="2"/><path d="M12 4v16"/></svg>مقطع <span class="en">Section</span></button>
    <button class="chip" id="mXray" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 4v16M4 12h16"/></svg>أشعة <span class="en">X-ray</span></button>
    <button class="chip" id="mExplode" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3v6M12 15v6M3 12h6M15 12h6"/></svg>تفكيك <span class="en">Explode</span></button>
    <button class="chip" id="mDusk" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M20 14A8 8 0 1110 4a6 6 0 0010 10z"/></svg>مساء <span class="en">Dusk</span></button>
    <button class="chip" id="mLabels" type="button" aria-pressed="true"><svg viewBox="0 0 24 24"><path d="M4 5h16v10H9l-5 4z"/></svg>شروحات <span class="en">Labels</span></button>
    <button class="chip" id="mLayers" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5zM3 13l9 5 9-5"/></svg>طبقات <span class="en">Layers</span></button>
    <button class="chip" id="mDims" type="button" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M3 17h18M3 13v8M21 13v8"/></svg>قياسات <span class="en">mm</span></button>
    <button class="chip" id="mTop" type="button"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v4M12 18v4M2 12h4M18 12h4"/></svg>من الفوق <span class="en">Top</span></button>
  </div>
  <div class="row" id="layers" aria-label="المراحل"></div>
  <div id="secCtl" hidden><label for="secPos">موضع المقطع</label><input id="secPos" type="range" min="0" max="1" step="0.001" value="0.5"></div>
</div>

<div id="pick" hidden></div>

<div class="player">
  <button id="play" type="button" aria-label="شغّل التركيب"><svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg></button>
  <div class="chapters" id="chapters"></div>
  <div class="track"><div class="ticks" id="ticks"></div><input id="scrub" type="range" min="0" max="1" step="0.001" value="1" aria-label="مرحلة التركيب"></div>
  <div class="right">
    <span class="backend" id="backend">…</span>
    <span class="time" id="time">0:00 / 0:00</span>
    <button class="icon" id="full" type="button" aria-label="ملء الشاشة"><svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</div>
<div id="loading"><span>يحمّل الموديل…</span></div>
<div id="err" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three/webgpu";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const $ = (id) => document.getElementById(id);
const ease = (t) => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };
const LAYER_COLORS = ["#e07a46", "#3f8fd6", "#e3b23c", "#4fae78", "#9b6ad6", "#d6567a", "#3fb3ad"];
const SPEED = 0.42;                          // build stages per second while playing

// ---------------------------------------------------------------- renderer
let renderer;
try {
  // WebGPU first; three falls back to WebGL2 itself when the browser has no WebGPU.
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: store.get("xray-webgl") === "1" });
  await renderer.init();
  renderer.onDeviceLost = () => { if (store.get("xray-webgl") !== "1") { store.set("xray-webgl", "1"); location.reload(); } };
} catch (e) {
  $("loading").hidden = true;
  $("err").hidden = false;
  $("err").textContent = "المتصفح هذا ما يقدرش يعرض 3D. جرّب Chrome ولا Safari جديد.";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.localClippingEnabled = true;           // per-material section plane
$("stage").appendChild(renderer.domElement);
$("backend").textContent = renderer.backend.isWebGPUBackend ? "WEBGPU" : "WEBGL2";

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: "absolute", inset: "0", pointerEvents: "none", direction: "ltr" });
$("stage").appendChild(labels.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(36, innerWidth / innerHeight, 0.02, 120);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 0.5;
controls.maxDistance = 16;
controls.autoRotateSpeed = 0.6;

// ---------------------------------------------------------------- environment: sky, floor, sun
function skyTexture(top, mid, bottom) {
  const c = document.createElement("canvas"); c.width = 4; c.height = 512;
  const x = c.getContext("2d"), g = x.createLinearGradient(0, 0, 0, 512);
  g.addColorStop(0, top); g.addColorStop(0.55, mid); g.addColorStop(1, bottom);
  x.fillStyle = g; x.fillRect(0, 0, 4, 512);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; return t;
}
const SKY = { day: skyTexture("#8fb3cf", "#dfe7ec", "#f2efe9"), dusk: skyTexture("#1d2340", "#7a5a72", "#e7a06d") };
scene.background = SKY.day;
scene.fog = new THREE.Fog(0xf0ede8, 10, 34);

function floorTexture() {             // large pale stone tiles, studio floor
  const c = document.createElement("canvas"); c.width = c.height = 512;
  const x = c.getContext("2d");
  x.fillStyle = "#e9e4dc"; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 2600; i++) { x.fillStyle = `rgba(120,105,85,${Math.random() * 0.05})`; x.fillRect(Math.random() * 512, Math.random() * 512, 2, 2); }
  x.strokeStyle = "rgba(90,80,70,.18)"; x.lineWidth = 2;
  for (let k = 0; k <= 512; k += 256) { x.beginPath(); x.moveTo(k, 0); x.lineTo(k, 512); x.stroke(); x.beginPath(); x.moveTo(0, k); x.lineTo(512, k); x.stroke(); }
  const t = new THREE.CanvasTexture(c); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(30, 30);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const floor = new THREE.Mesh(new THREE.CircleGeometry(40, 96), new THREE.MeshStandardMaterial({ map: floorTexture(), roughness: 0.9 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

const hemi = new THREE.HemisphereLight(0xdfeaff, 0x9a8f80, 1.25);
const sun = new THREE.DirectionalLight(0xfff3e2, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
sun.shadow.radius = 4;
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.5);
fill.position.set(-3, 2, -2);
scene.add(hemi, sun, fill, sun.target);

// ---------------------------------------------------------------- materials
function woodTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const x = c.getContext("2d");
  x.fillStyle = "#d5b384"; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 220; i++) {
    const y = Math.random() * 512;
    x.strokeStyle = `rgba(120,80,40,${0.03 + Math.random() * 0.07})`; x.lineWidth = 0.6 + Math.random() * 2.2;
    x.beginPath(); x.moveTo(0, y);
    for (let s = 0; s <= 512; s += 32) x.lineTo(s, y + Math.sin(s / 60 + i) * 4);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const section = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const clip = [];
const WOOD_MAP = woodTexture();
const std = (o) => new THREE.MeshStandardMaterial({ side: THREE.DoubleSide, clippingPlanes: clip, ...o });
const wood = std({ map: WOOD_MAP, roughness: 0.62 });
const hot = std({ color: 0xe07a46, roughness: 0.5, emissive: 0x401406 });
const picked = std({ color: 0xffffff, roughness: 0.4, emissive: 0x2a6fd6, emissiveIntensity: 0.6 });
const ghostWood = std({ map: WOOD_MAP, roughness: 0.62, transparent: true, opacity: 0.16, depthWrite: false });
const layerMats = LAYER_COLORS.map((c) => std({ color: c, roughness: 0.55 }));
const fabric = [
  new THREE.MeshPhysicalMaterial({ side: THREE.DoubleSide, color: 0xece6db, roughness: 1, sheen: 1, sheenColor: 0xffffff, sheenRoughness: 0.6, transparent: true, clippingPlanes: clip }),
  new THREE.MeshPhysicalMaterial({ side: THREE.DoubleSide, color: 0x9a9da1, roughness: 1, sheen: 1, sheenColor: 0xdddddd, sheenRoughness: 0.6, transparent: true, clippingPlanes: clip }),
];
const allMats = [wood, hot, picked, ghostWood, ...layerMats, ...fabric];

function boxUV(geo) {               // grain runs along every plate whatever its plane
  const p = geo.attributes.position, n = geo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    const [u, v] = az >= ax && az >= ay ? [p.getX(i), p.getY(i)] : ax >= ay ? [p.getY(i), p.getZ(i)] : [p.getX(i), p.getZ(i)];
    uv[2 * i] = u / 260; uv[2 * i + 1] = v / 260;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
}

// ---------------------------------------------------------------- model
const world = new THREE.Group();            // z-up millimetres -> y-up metres
world.rotation.x = -Math.PI / 2;
world.scale.setScalar(0.001);
scene.add(world);

const S = { s: 1, playing: false, explode: 0, xray: false, labels: true, section: false, dusk: false, dims: false, layers: false, pick: null, hidden: new Set() };
let M = null;
const cache = {};

async function fetchBin(url) {      // geometry ships as base64 text (artifacts serve text, not raw binary)
  const b64 = (await (await fetch(url)).text()).trim();
  const raw = atob(b64), out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out.buffer;
}

function meshFrom(pos, idx, v, i) {
  const g = new THREE.BufferGeometry();
  g.setAttribute("position", new THREE.BufferAttribute(pos.slice(v[0] * 3, (v[0] + v[1]) * 3), 3));
  const local = new Uint32Array(i[1]);
  for (let k = 0; k < i[1]; k++) local[k] = idx[i[0] + k] - v[0];
  g.setIndex(new THREE.BufferAttribute(local, 1));
  g.computeVertexNormals();
  return g;
}

async function loadModel(key) {
  $("loading").hidden = false;
  if (!cache[key]) {
    const meta = await (await fetch(`models/${key}.json`)).json();
    const bin = await fetchBin(`models/${key}.bin.txt`);
    const uph = meta.upholstery ? await fetchBin(`models/${key}.uph.bin.txt`) : null;
    cache[key] = { meta, bin, uph };
  }
  const { meta, bin, uph } = cache[key];
  world.clear();
  S.pick = null; S.hidden = new Set(); $("pick").hidden = true;

  const pos = new Float32Array(bin, 0, meta.nverts * 3);
  const idx = new Uint32Array(bin, meta.nverts * 12, meta.nidx);
  const pieces = meta.pieces.map((p, n) => {
    const g = meshFrom(pos, idx, p.v, p.i);
    boxUV(g);
    const m = new THREE.Mesh(g, wood);
    m.castShadow = m.receiveShadow = true;
    m.userData = { p, n };
    world.add(m);
    return m;
  });
  const per = {};
  pieces.slice().sort((a, b) => a.userData.p.stage - b.userData.p.stage || a.userData.p.order - b.userData.p.order)
    .forEach((m) => (per[m.userData.p.stage] ??= []).push(m));
  for (const st in per) per[st].forEach((m, k, arr) => (m.userData.f = k / Math.max(arr.length, 1)));

  const shells = new THREE.Group();
  if (uph) {
    const u = meta.upholstery;
    const up = new Float32Array(uph, 0, u.nverts * 3), ui = new Uint32Array(uph, u.nverts * 12, u.nidx);
    for (const part of u.parts) {
      const m = new THREE.Mesh(meshFrom(up, ui, part.v, part.i), fabric[part.tone] || fabric[0]);
      m.castShadow = m.receiveShadow = true;
      shells.add(m);
    }
  }
  world.add(shells);

  const stages = meta.stages.slice();
  if (uph) stages.push({ key: "DONE", en: "FINISHED", ar: "الشكل النهائي", text: "الإسفنج والبوكليه فوق نفس الهيكل. «أشعة» تبيّن الهيكل من تحت القماش." });

  // one label per stage: title + what it is, on a stem over the middle of its pieces
  const anns = [];
  meta.stages.forEach((st, i) => {
    const ps = pieces.filter((m) => m.userData.p.stage === i);
    if (!ps.length) return;
    const top = Math.max(...ps.map((m) => m.userData.p.box[5]));
    const b = ps[Math.floor(ps.length / 2)].userData.p.box;
    const el = document.createElement("div"); el.className = "ann";
    el.innerHTML = `<div class="card"><b></b><small></small></div><div class="stem"></div><div class="dot"></div>`;
    el.querySelector("b").textContent = st.ar;
    el.querySelector("small").textContent = `${ps.length} pcs · ${st.en.toLowerCase()}`;
    const o = new CSS2DObject(el);
    o.position.set((b[0] + b[3]) / 2, (b[1] + b[4]) / 2, top + 10);
    o.center.set(0.5, 1);
    world.add(o);
    anns.push({ o, stage: i });
  });

  const box = new THREE.Box3();
  pieces.forEach((m) => { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); });
  const dims = new THREE.Group();
  {
    const { min, max } = box, mat = new THREE.LineBasicMaterial({ color: 0xe07a46 });
    const line = (a, b) => dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
    const tag = (txt, p) => { const el = document.createElement("div"); el.className = "dim"; el.textContent = txt; const o = new CSS2DObject(el); o.position.copy(p); dims.add(o); };
    const pad = Math.max(60, (max.x - min.x) * 0.05), y0 = min.y - pad, x1 = max.x + pad;
    line(new THREE.Vector3(min.x, y0, 0), new THREE.Vector3(max.x, y0, 0));
    tag(`${Math.round(max.x - min.x)} mm`, new THREE.Vector3((min.x + max.x) / 2, y0, 0));
    line(new THREE.Vector3(x1, min.y, 0), new THREE.Vector3(x1, max.y, 0));
    tag(`${Math.round(max.y - min.y)} mm`, new THREE.Vector3(x1, (min.y + max.y) / 2, 0));
    line(new THREE.Vector3(x1, min.y, 0), new THREE.Vector3(x1, min.y, max.z));
    tag(`${Math.round(max.z)} mm`, new THREE.Vector3(x1, min.y, max.z / 2));
    world.add(dims);
  }

  const size = [box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z];
  M = { key, meta, pieces, shells, stages, anns, dims, size, hasUph: !!uph };
  S.s = stages.length; S.playing = false; setPlay();
  $("scrub").max = stages.length;

  const r = Math.max(size[0], size[1]) / 1000 * 0.8 + 0.4;
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.2, far: 14 });
  sun.shadow.camera.updateProjectionMatrix();

  // chapters over the track, ticks on it, layer toggles
  $("chapters").innerHTML = ""; $("ticks").innerHTML = ""; $("layers").innerHTML = "";
  stages.forEach((st, i) => {
    const x = ((i + 0.5) / stages.length) * 100;
    const el = document.createElement("span");
    el.style.left = `${x}%`;
    el.innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b>`;
    el.append(st.en);
    el.title = st.ar;
    el.addEventListener("click", () => { S.playing = false; setPlay(); tween("s", i + 1); });
    $("chapters").appendChild(el);
    if (i) { const t = document.createElement("i"); t.style.left = `${(i / stages.length) * 100}%`; $("ticks").appendChild(t); }
  });
  meta.stages.forEach((st, i) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip layer"; b.setAttribute("aria-pressed", "true");
    b.innerHTML = `<i style="background:${LAYER_COLORS[i % LAYER_COLORS.length]}"></i>`;
    b.append(st.ar);
    b.addEventListener("click", () => {
      S.hidden.has(i) ? S.hidden.delete(i) : S.hidden.add(i);
      b.setAttribute("aria-pressed", !S.hidden.has(i));
    });
    $("layers").appendChild(b);
  });
  $("fPieces").textContent = pieces.length;
  $("fSize").textContent = `${size.map(Math.round).join(" × ")} mm`;
  $("kicker").textContent = `THE FRAME X-RAY · ${meta.name.toUpperCase()}`;
  [...$("models").children].forEach((b) => b.setAttribute("aria-current", b.dataset.key === key));
  const canX = !!uph || meta.ghost != null;
  $("mXray").disabled = !canX;
  view("hero", true);
  $("loading").hidden = true;
}

// ---------------------------------------------------------------- per-frame build state
const fmt = (t) => `${Math.floor(t / 60)}:${String(Math.floor(t % 60)).padStart(2, "0")}`;
function applyBuild() {
  if (!M) return;
  const H = M.size[2], L = Math.max(M.size[0], M.size[1]);
  const nst = M.meta.stages.length;
  const fin = M.hasUph ? Math.min(Math.max(S.s - nst, 0), 1) : 0;
  const ghost = S.xray || S.section;
  const hideFrame = fin > 0.98 && !ghost && S.explode < 0.05 && !S.layers;
  let placed = 0;
  for (const m of M.pieces) {
    const { p, f } = m.userData;
    const t = (S.s - p.stage - f * 0.6) / 0.4;
    m.visible = t > 0 && !hideFrame && !S.hidden.has(p.stage);
    const k = 1 - ease(t);
    const dist = Math.abs(p.travel[2]) > 0.5 ? H * 0.9 + 200 : L * 0.35 + 200;
    m.position.set(-p.travel[0] * dist * k, -p.travel[1] * dist * k, -p.travel[2] * dist * k + p.stage * H * 0.45 * S.explode);
    const skin = !M.hasUph && S.xray && M.meta.ghost === p.stage;
    m.material = m === S.pick ? picked : (t > 0 && t < 1.15) ? hot : skin ? ghostWood
      : S.layers ? layerMats[p.stage % layerMats.length] : wood;
    if (t >= 1) placed++;
  }
  M.shells.visible = fin > 0.001 && S.explode < 0.05 && !S.layers;
  for (const f of fabric) { f.opacity = (ghost ? 0.2 : 1) * ease(fin); f.depthWrite = !ghost && fin > 0.99; }
  const st = Math.min(Math.floor(S.s), M.stages.length - 1);
  const stg = M.stages[Math.max(st, 0)];
  $("stTitle").textContent = stg.ar;
  $("stText").textContent = stg.text;
  $("fPlaced").textContent = placed;
  [...$("chapters").children].forEach((el, i) => { el.classList.toggle("on", i <= st); el.classList.toggle("cur", i === st); });
  for (const a of M.anns) a.o.visible = S.labels && S.s >= a.stage + 0.6 && !S.hidden.has(a.stage) && !(fin > 0.5 && !ghost);
  M.dims.visible = S.dims;
  $("scrub").value = S.s;
  $("time").textContent = `${fmt(S.s / SPEED)} / ${fmt(M.stages.length / SPEED)}`;
}

// ---------------------------------------------------------------- camera
function heroView() {
  // fit the model's own size: a 0.4 m table fills the screen as well as a 3 m sofa
  const a = innerWidth / innerHeight, vf = THREE.MathUtils.degToRad(36);
  const hf = 2 * Math.atan(Math.tan(vf / 2) * a);
  const w = (M ? Math.max(M.size[0], M.size[1] * 0.8) : 3000) / 1000 * 1.15;
  const h = (M ? M.size[2] : 800) / 1000 * 1.15;
  const need = Math.max(w / 2 / Math.tan(hf / 2), h / 2 / Math.tan(vf / 2) * 1.6);
  const dir = new THREE.Vector3(-1.5, 1.15, 3.9).normalize();
  const wide = innerWidth >= 760;
  const at = new THREE.Vector3(0, h * 0.42, 0);
  return { pos: dir.multiplyScalar(Math.max(need * (wide ? 1.45 : 1.15), 0.9)).add(at), at };
}
let camTween = null;
function view(name, instant) {
  let v = heroView();
  if (name === "top") v = { pos: new THREE.Vector3(0, v.pos.length() * 1.05, 0.01), at: new THREE.Vector3(0, 0, 0) };
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.at); camTween = null; return; }
  camTween = { t: 0, from: camera.position.clone(), to: v.pos, af: controls.target.clone(), at: v.at };
}
const tweens = {};
function tween(key, to, dur = 0.9) { tweens[key] = { from: S[key], to, t: 0, dur }; }

// ---------------------------------------------------------------- controls
const toggle = (id, key, fn) => $(id).addEventListener("click", () => {
  S[key] = !S[key]; $(id).setAttribute("aria-pressed", S[key]); fn?.(S[key]);
});
$("mHero").addEventListener("click", () => view("hero"));
$("mTop").addEventListener("click", () => view("top"));
toggle("mExplode", "explodeOn", (on) => tween("explode", on ? 1 : 0));
toggle("mXray", "xray", (on) => { if (on && M && S.s < M.stages.length) tween("s", M.stages.length); });
toggle("mLabels", "labels");
toggle("mDims", "dims");
toggle("mLayers", "layers");
toggle("mSection", "section", (on) => {
  clip.length = 0; if (on) clip.push(section);
  allMats.forEach((m) => (m.needsUpdate = true));
  $("secCtl").hidden = !on;
});
toggle("mDusk", "dusk", () => applyLook());
$("scrub").addEventListener("input", (e) => { S.playing = false; delete tweens.s; S.s = +e.target.value; setPlay(); });
const ICON_PLAY = '<svg viewBox="0 0 24 24"><path d="M7 4l13 8-13 8z"/></svg>';
const ICON_PAUSE = '<svg viewBox="0 0 24 24"><path d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg>';
function setPlay() {
  $("play").innerHTML = S.playing ? ICON_PAUSE : ICON_PLAY;
  $("play").setAttribute("aria-label", S.playing ? "أوقف" : "شغّل التركيب");
  controls.autoRotate = S.playing;
}
$("play").addEventListener("click", () => {
  if (!M) return;
  if (!S.playing && S.s >= M.stages.length - 0.01) S.s = 0;
  S.playing = !S.playing; setPlay();
});
$("full").addEventListener("click", () => {
  const d = document;
  (d.fullscreenElement ? d.exitFullscreen?.() : d.documentElement.requestFullscreen?.())?.catch?.(() => {});
});

const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => (down = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!M || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(M.pieces.filter((m) => m.visible), false)
    .find((h) => !S.section || section.distanceToPoint(h.point) > 0);
  S.pick = hit ? hit.object : null;
  const box = $("pick");
  box.hidden = !S.pick;
  if (S.pick) {
    const p = S.pick.userData.p, st = M.meta.stages[p.stage];
    box.innerHTML = "";
    const a = document.createElement("div"); a.className = "id"; a.textContent = p.label;
    const b = document.createElement("div"); b.className = "st"; b.textContent = `${st.ar} · ${st.en}`;
    box.append(a, b);
  }
});

const index = await (await fetch("models/index.json")).json();
for (const m of index) {
  const b = document.createElement("button");
  b.className = "model"; b.type = "button"; b.dataset.key = m.key; b.textContent = m.ar;
  b.addEventListener("click", () => { if (!M || M.key !== m.key) { history.replaceState(null, "", `#${m.key}`); loadModel(m.key); } });
  $("models").appendChild(b);
}

// ---------------------------------------------------------------- look
function applyLook() {
  scene.background = S.dusk ? SKY.dusk : SKY.day;
  scene.fog.color.set(S.dusk ? 0x8a7488 : 0xf0ede8);
  floor.material.color.set(S.dusk ? 0xc9c0c4 : 0xffffff);
  hemi.intensity = S.dusk ? 0.45 : 1.25;
  hemi.color.set(S.dusk ? 0x6a6fa8 : 0xdfeaff);
  sun.color.set(S.dusk ? 0xffa060 : 0xfff3e2);
  sun.intensity = S.dusk ? 3.0 : 2.6;
  sun.position.set(S.dusk ? 4.5 : 2.5, S.dusk ? 1.2 : 4.4, S.dusk ? 1.5 : 3.0);
  fill.intensity = S.dusk ? 0.2 : 0.5;
  document.documentElement.style.setProperty("--title", S.dusk ? "#f4f1ec" : "#1d2023");
  document.documentElement.style.setProperty("--title-dim", S.dusk ? "rgba(244,241,236,.7)" : "rgba(29,32,35,.66)");
}
applyLook();

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.playing && M) { S.s = Math.min(S.s + dt * SPEED, M.stages.length); if (S.s >= M.stages.length) { S.playing = false; setPlay(); } }
  for (const k in tweens) {
    const tw = tweens[k]; tw.t += dt / (reduce ? 0.01 : tw.dur);
    S[k] = THREE.MathUtils.lerp(tw.from, tw.to, ease(tw.t)); if (tw.t >= 1) delete tweens[k];
  }
  if (camTween) {
    camTween.t += dt / (reduce ? 0.01 : 1.1); const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.from, camTween.to, e); controls.target.lerpVectors(camTween.af, camTween.at, e);
    if (camTween.t >= 1) camTween = null;
  }
  if (S.section) {   // the cut faces the camera; the slider moves it front to back
    const dir = new THREE.Vector3().subVectors(controls.target, camera.position).setY(0).normalize();
    const span = M ? Math.max(M.size[0], M.size[1]) / 2000 : 0.6;
    const c = THREE.MathUtils.lerp(-span, span, +$("secPos").value);
    section.normal.copy(dir); section.constant = -(c + dir.dot(controls.target));
  }
  applyBuild();
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});

addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (index.some((m) => m.key === k) && (!M || M.key !== k)) loadModel(k);
});
const first = location.hash.slice(1);
await loadModel(index.some((m) => m.key === first) ? first : index[0].key);
window.__xray = { S, get M() { return M; }, loadModel };
</script>
