<title>Nouvella X-Ray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cairo:wght@500;700;800&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: full-bleed 3D stage; floating glass cards (top: models + view modes, side: stage card, bottom: build timeline). */
:root {
  --bg: #e4e7e8;            /* cool concrete, the workshop floor */
  --fg: #1b2226;
  --muted: #5b666c;
  --panel: rgba(250, 251, 251, .80);
  --line: rgba(27, 34, 38, .14);
  --accent: #c4562a;        /* terracotta = a piece on its way in */
  --ok: #2c8a57;
  --font-ui: "Cairo", "Segoe UI", Tahoma, sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --r: 12px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #11161a; --fg: #e7ecee; --muted: #93a0a7; --panel: rgba(20, 26, 31, .82);
  --line: rgba(231, 236, 238, .14); --accent: #e0703f; --ok: #4cbb7c; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #11161a; --fg: #e7ecee; --muted: #93a0a7; --panel: rgba(20, 26, 31, .82);
  --line: rgba(231, 236, 238, .14); --accent: #e0703f; --ok: #4cbb7c; color-scheme: dark }

html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-ui); overflow: hidden; direction: rtl; }
#stage { position: fixed; inset: 0; }
#stage canvas { display: block; width: 100%; height: 100%; touch-action: none; }
.glass { background: var(--panel); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border: 1px solid var(--line); border-radius: var(--r); }

header { position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); inset-inline: 16px;
  display: flex; gap: 12px; align-items: flex-start; justify-content: space-between; pointer-events: none; }
header > * { pointer-events: auto; min-width: 0; }
.brand { padding: 10px 14px; display: grid; gap: 8px; max-width: 520px; }
.brand .eyebrow { font: 600 11px/1 var(--font-data); letter-spacing: .18em; color: var(--muted); direction: ltr; text-align: right; }
.brand .eyebrow b { color: var(--accent); font-weight: 600; }
.models { display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
.model { flex: none; font: 800 15px/1 var(--font-ui); color: var(--muted); background: transparent; border: 0;
  border-bottom: 2px solid transparent; padding: 6px 4px 8px; cursor: pointer; }
.model[aria-current="true"] { color: var(--fg); border-bottom-color: var(--accent); }
.model:hover { color: var(--fg); }

.modes { display: flex; flex-wrap: wrap; gap: 6px; padding: 8px; max-width: 560px; }
.chip { font: 700 13px/1 var(--font-ui); color: var(--fg); background: transparent; border: 1px solid var(--line);
  border-radius: 999px; padding: 8px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip:hover { border-color: var(--fg); }
.chip:focus-visible, .model:focus-visible, .tl button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.chip[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.chip .k { font: 400 10px/1 var(--font-data); opacity: .6; direction: ltr; }

aside { position: fixed; top: 150px; inset-inline-start: 16px; width: min(330px, calc(100vw - 32px));
  padding: 16px; display: grid; gap: 10px; }
aside .step { font: 600 11px/1 var(--font-data); letter-spacing: .14em; color: var(--accent); direction: ltr; text-align: right; }
aside h2 { margin: 0; font-size: 26px; font-weight: 800; line-height: 1.2; text-wrap: balance; }
aside p { margin: 0; color: var(--muted); line-height: 1.7; font-size: 14px; min-height: 3.4em; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; border-top: 1px solid var(--line); padding-top: 10px; }
.stats div { display: grid; gap: 2px; min-width: 0; }
.stats b { font: 600 17px/1.15 var(--font-data); font-variant-numeric: tabular-nums; direction: ltr; text-align: right; }
.stats span { font-size: 11px; color: var(--muted); }
.src { font-size: 12px; color: var(--ok); font-weight: 700; display: flex; gap: 8px; align-items: center; }
.src i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
#pick { border-top: 1px solid var(--line); padding-top: 10px; display: grid; gap: 4px; }
#pick .id { font: 600 14px/1.3 var(--font-data); direction: ltr; text-align: right; overflow-wrap: anywhere; }
#pick .hint { color: var(--muted); font-size: 12px; }

#sectionCtl { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
#sectionCtl input { flex: 1; accent-color: var(--accent); direction: ltr; min-width: 0; }

.tl { position: fixed; bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); inset-inline: 16px;
  padding: 10px 14px 12px; display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; align-items: center; }
.tl button { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--accent); color: #fff;
  font-size: 15px; cursor: pointer; grid-row: span 2; }
.tl input[type=range] { width: 100%; accent-color: var(--accent); direction: ltr; margin: 0; }
.marks { display: grid; direction: ltr; font: 600 10px/1.2 var(--font-data); letter-spacing: .06em; color: var(--muted); }
.marks span { text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: pointer; padding-inline-end: 6px; }
.marks span.on { color: var(--fg); }
.marks span b { color: var(--accent); font-weight: 600; }

.ann, .dim { left: 0; top: 0; }
.ann { direction: rtl; font: 700 12px/1.3 var(--font-ui); color: var(--fg); background: var(--panel); border: 1px solid var(--line);
  border-radius: 8px; padding: 5px 9px; white-space: nowrap; pointer-events: none; }
.ann small { display: block; font: 400 10px/1.3 var(--font-data); color: var(--muted); direction: ltr; text-align: right; }
.dim { font: 600 12px/1 var(--font-data); color: var(--accent); background: var(--panel); padding: 3px 6px; border-radius: 6px; pointer-events: none; }
#loading { position: fixed; inset: 0; display: grid; place-items: center; pointer-events: none; }
#loading span { padding: 10px 16px; font-weight: 700; }
#err { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; }

@media (max-width: 760px) {
  header { flex-direction: column; align-items: stretch; gap: 8px; }
  .brand { max-width: none; }
  .modes { max-width: none; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .chip { flex: none; }
  aside { top: auto; bottom: calc(env(safe-area-inset-bottom, 0px) + 96px); inset-inline: 16px; width: auto; padding: 12px; gap: 6px; }
  aside h2 { font-size: 20px; }
  aside p { font-size: 13px; line-height: 1.55; min-height: 0; }
  aside .stats, aside .src { display: none; }
  .marks { font-size: 9px; letter-spacing: 0; }
}
</style>

<div id="stage" aria-label="نموذج 3D تفاعلي لهيكل الموديل"></div>

<header>
  <div class="brand glass">
    <div class="eyebrow">NOUVELLA CASA · FRAME X-RAY · <b id="backend">…</b></div>
    <nav class="models" id="models" aria-label="الموديلات"></nav>
  </div>
  <nav class="modes glass" aria-label="أوضاع العرض">
    <button class="chip" id="mHero" type="button">الواجهة <span class="k">Hero</span></button>
    <button class="chip" id="mExplode" type="button" aria-pressed="false">تفكيك <span class="k">Explode</span></button>
    <button class="chip" id="mSection" type="button" aria-pressed="false">مقطع <span class="k">Section</span></button>
    <button class="chip" id="mXray" type="button" aria-pressed="false">أشعة <span class="k">X-ray</span></button>
    <button class="chip" id="mLabels" type="button" aria-pressed="true">شروحات <span class="k">Labels</span></button>
    <button class="chip" id="mDims" type="button" aria-pressed="false">القياسات <span class="k">mm</span></button>
    <button class="chip" id="mDusk" type="button" aria-pressed="false">مساء <span class="k">Dusk</span></button>
    <button class="chip" id="mTop" type="button">من الفوق <span class="k">Top</span></button>
  </nav>
</header>

<aside class="glass" aria-live="polite">
  <div class="step" id="stStep">STEP 01</div>
  <h2 id="stTitle">…</h2>
  <p id="stText"></p>
  <div id="sectionCtl" hidden><label for="secPos">موضع المقطع</label><input id="secPos" type="range" min="0" max="1" step="0.001" value="0.5"></div>
  <div class="stats">
    <div><b id="sPieces">0</b><span>قطعة</span></div>

<div class="tl glass">
  <button id="play" type="button" aria-label="شغّل التركيب">▶</button>

  <div class="marks" id="marks"></div>
</div>
<div id="loading"><span class="glass">يحمّل الموديل…</span></div>
<div id="err" hidden></div>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.webgpu.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
} }
</script>
<script type="module">
import * as THREE from "three/webgpu";
import { OrbitControls } from "three/addons/controls/OrbitControls.js";
import { CSS2DRenderer, CSS2DObject } from "three/addons/renderers/CSS2DRenderer.js";

const $ = (id) => document.getElementById(id);
const css = (v) => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const ease = (t) => 1 - Math.pow(1 - Math.min(Math.max(t, 0), 1), 3);
const store = { get(k) { try { return sessionStorage.getItem(k); } catch { return null; } },
                set(k, v) { try { sessionStorage.setItem(k, v); } catch {} } };

// ---------------------------------------------------------------- renderer
let renderer;
try {
  // WebGPU first; three falls back to WebGL2 itself when the browser has no WebGPU.
  renderer = new THREE.WebGPURenderer({ antialias: true, forceWebGL: store.get("xray-webgl") === "1" });
  await renderer.init();
  renderer.onDeviceLost = () => { if (store.get("xray-webgl") !== "1") { store.set("xray-webgl", "1"); location.reload(); } };
} catch (e) {
  $("loading").hidden = true;
  $("err").hidden = false;
  $("err").textContent = "المتصفح هذا ما يقدرش يعرض 3D. جرّب Chrome ولا Safari جديد.";
  throw e;
}
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
$("stage").appendChild(renderer.domElement);
$("backend").textContent = renderer.backend.isWebGPUBackend ? "WEBGPU" : "WEBGL2";

const labels = new CSS2DRenderer();
labels.setSize(innerWidth, innerHeight);
Object.assign(labels.domElement.style, { position: "absolute", inset: "0", pointerEvents: "none", direction: "ltr" });
$("stage").appendChild(labels.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(38, innerWidth / innerHeight, 0.02, 80);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.maxPolarAngle = Math.PI * 0.49;
controls.minDistance = 0.5;
controls.maxDistance = 16;

const hemi = new THREE.HemisphereLight(0xffffff, 0x8a8f92, 1.1);
const sun = new THREE.DirectionalLight(0xffffff, 2.4);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0004;
const fill = new THREE.DirectionalLight(0xdfe8ff, 0.6);
fill.position.set(-3, 2, -2);
scene.add(hemi, sun, fill, sun.target);
const floor = new THREE.Mesh(new THREE.CircleGeometry(12, 64), new THREE.MeshStandardMaterial({ roughness: 0.95 }));
floor.rotation.x = -Math.PI / 2;
floor.receiveShadow = true;
scene.add(floor);

// ---------------------------------------------------------------- materials
function woodTexture() {
  const c = document.createElement("canvas"); c.width = 512; c.height = 512;
  const x = c.getContext("2d");
  x.fillStyle = "#d5b384"; x.fillRect(0, 0, 512, 512);
  for (let i = 0; i < 220; i++) {
    const y = Math.random() * 512;
    x.strokeStyle = `rgba(120,80,40,${0.03 + Math.random() * 0.07})`; x.lineWidth = 0.6 + Math.random() * 2.2;
    x.beginPath(); x.moveTo(0, y);
    for (let s = 0; s <= 512; s += 32) x.lineTo(s, y + Math.sin(s / 60 + i) * 4);
    x.stroke();
  }
  const t = new THREE.CanvasTexture(c);
  t.wrapS = t.wrapT = THREE.RepeatWrapping; t.colorSpace = THREE.SRGBColorSpace;
  return t;
}
const section = new THREE.Plane(new THREE.Vector3(0, 0, -1), 0);
const clip = [];
const wood = new THREE.MeshStandardMaterial({ map: woodTexture(), roughness: 0.62, side: THREE.DoubleSide, clippingPlanes: clip });
const hot = new THREE.MeshStandardMaterial({ color: css("--accent") || "#c4562a", roughness: 0.55, side: THREE.DoubleSide, clippingPlanes: clip });
const picked = new THREE.MeshStandardMaterial({ color: 0x2c8a57, roughness: 0.5, side: THREE.DoubleSide, clippingPlanes: clip });
const fabric = [
  new THREE.MeshPhysicalMaterial({ side: THREE.DoubleSide, color: 0xe9e3d8, roughness: 1, sheen: 1, sheenColor: 0xffffff, sheenRoughness: 0.6, transparent: true, clippingPlanes: clip }),
  new THREE.MeshPhysicalMaterial({ side: THREE.DoubleSide, color: 0x9a9da1, roughness: 1, sheen: 1, sheenColor: 0xdddddd, sheenRoughness: 0.6, transparent: true, clippingPlanes: clip }),
];
const ghostWood = new THREE.MeshStandardMaterial({ map: wood.map, roughness: 0.62, side: THREE.DoubleSide, transparent: true, opacity: 0.16, depthWrite: false, clippingPlanes: clip });
const allMats = [wood, hot, picked, ghostWood, ...fabric];

// box-projected UVs so the grain runs along every plate whatever its plane
function boxUV(geo) {
  const p = geo.attributes.position, n = geo.attributes.normal, uv = new Float32Array(p.count * 2);
  for (let i = 0; i < p.count; i++) {
    const ax = Math.abs(n.getX(i)), ay = Math.abs(n.getY(i)), az = Math.abs(n.getZ(i));
    const [u, v] = az >= ax && az >= ay ? [p.getX(i), p.getY(i)] : ax >= ay ? [p.getY(i), p.getZ(i)] : [p.getX(i), p.getZ(i)];
    uv[2 * i] = u / 260; uv[2 * i + 1] = v / 260;
  }
  geo.setAttribute("uv", new THREE.BufferAttribute(uv, 2));
}

// ---------------------------------------------------------------- model
const world = new THREE.Group();            // z-up millimetres -> y-up metres
world.rotation.x = -Math.PI / 2;
world.scale.setScalar(0.001);
scene.add(world);

const S = { s: 1, playing: false, explode: 0, xray: false, labels: true, section: false, dusk: false, dims: false, pick: null };
let M = null;                               // the loaded model
const cache = {};

// geometry ships as base64 text (artifacts serve text, not raw binary)
async function fetchBin(url) {
  const b64 = (await (await fetch(url)).text()).trim();
  const raw = atob(b64), out = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) out[i] = raw.charCodeAt(i);
  return out.buffer;
}

async function loadModel(key) {
  $("loading").hidden = false;
  if (!cache[key]) {
    const meta = await (await fetch(`models/${key}.json`)).json();
    const bin = await fetchBin(`models/${key}.bin.txt`);
    const uph = meta.upholstery ? await fetchBin(`models/${key}.uph.bin.txt`) : null;
    cache[key] = { meta, bin, uph };
  }
  const { meta, bin, uph } = cache[key];
  world.clear();
  S.pick = null;

  const pos = new Float32Array(bin, 0, meta.nverts * 3);
  const idx = new Uint32Array(bin, meta.nverts * 12, meta.nidx);
  const pieces = [];
  meta.pieces.forEach((p, n) => {
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.BufferAttribute(pos.slice(p.v[0] * 3, (p.v[0] + p.v[1]) * 3), 3));
    const local = new Uint32Array(p.i[1]);
    for (let k = 0; k < p.i[1]; k++) local[k] = idx[p.i[0] + k] - p.v[0];
    g.setIndex(new THREE.BufferAttribute(local, 1));
    g.computeVertexNormals();
    boxUV(g);
    const m = new THREE.Mesh(g, wood);
    m.castShadow = m.receiveShadow = true;
    m.userData = { p, n };
    world.add(m);
    pieces.push(m);
  });
  // build order: stage, then the model's own sequence
  const seq = pieces.slice().sort((a, b) => a.userData.p.stage - b.userData.p.stage || a.userData.p.order - b.userData.p.order);
  const per = {};
  seq.forEach((m) => (per[m.userData.p.stage] ??= []).push(m));
  for (const st in per) per[st].forEach((m, k, arr) => (m.userData.f = k / Math.max(arr.length, 1)));

  const shells = new THREE.Group();
  if (uph) {
    const u = meta.upholstery;
    const up = new Float32Array(uph, 0, u.nverts * 3), ui = new Uint32Array(uph, u.nverts * 12, u.nidx);
    for (const part of u.parts) {
      const g = new THREE.BufferGeometry();
      g.setAttribute("position", new THREE.BufferAttribute(up.slice(part.v[0] * 3, (part.v[0] + part.v[1]) * 3), 3));
      const li = new Uint32Array(part.i[1]);
      for (let k = 0; k < part.i[1]; k++) li[k] = ui[part.i[0] + k] - part.v[0];
      g.setIndex(new THREE.BufferAttribute(li, 1));
      g.computeVertexNormals();
      const m = new THREE.Mesh(g, fabric[part.tone] || fabric[0]);
      m.castShadow = m.receiveShadow = true;
      shells.add(m);
    }
  }
  world.add(shells);

  const stages = meta.stages.slice();
  if (uph) stages.push({ key: "DONE", en: "FINISHED", ar: "الشكل النهائي", text: "الإسفنج والبوكليه فوق نفس الهيكل. «أشعة» تبيّن الهيكل من تحت القماش." });

  // one label per stage, over the middle of that stage's pieces
  const anns = [];
  meta.stages.forEach((st, i) => {
    const ps = pieces.filter((m) => m.userData.p.stage === i);
    if (!ps.length) return;
    const b = ps.map((m) => m.userData.p.box);
    const top = Math.max(...b.map((x) => x[5]));
    const pick = ps[Math.floor(ps.length / 2)].userData.p.box;
    const el = document.createElement("div"); el.className = "ann";
    el.innerHTML = `${st.ar} · ${ps.length}<small>${st.en}</small>`;
    const o = new CSS2DObject(el);
    o.position.set((pick[0] + pick[3]) / 2, (pick[1] + pick[4]) / 2, top + 40);
    world.add(o);
    anns.push({ o, stage: i });
  });

  // dimensions measured from the loaded geometry
  const box = new THREE.Box3();
  pieces.forEach((m) => { m.geometry.computeBoundingBox(); box.union(m.geometry.boundingBox); });
  const dims = new THREE.Group();
  {
    const { min, max } = box, mat = new THREE.LineBasicMaterial({ color: css("--accent") || "#c4562a" });
    const line = (a, b) => dims.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, b]), mat));
    const tag = (txt, p) => { const el = document.createElement("div"); el.className = "dim"; el.textContent = txt; const o = new CSS2DObject(el); o.position.copy(p); dims.add(o); };
    const pad = Math.max(60, (max.x - min.x) * 0.05), y0 = min.y - pad, x1 = max.x + pad;
    line(new THREE.Vector3(min.x, y0, 0), new THREE.Vector3(max.x, y0, 0));
    tag(`${Math.round(max.x - min.x)} mm`, new THREE.Vector3((min.x + max.x) / 2, y0, 0));
    line(new THREE.Vector3(x1, min.y, 0), new THREE.Vector3(x1, max.y, 0));
    tag(`${Math.round(max.y - min.y)} mm`, new THREE.Vector3(x1, (min.y + max.y) / 2, 0));
    line(new THREE.Vector3(x1, min.y, 0), new THREE.Vector3(x1, min.y, max.z));
    tag(`${Math.round(max.z)} mm`, new THREE.Vector3(x1, min.y, max.z / 2));
    dims.visible = S.dims;
    world.add(dims);
  }

  const size = [box.max.x - box.min.x, box.max.y - box.min.y, box.max.z - box.min.z];
  M = { key, meta, pieces, shells, stages, anns, dims, size, hasUph: !!uph };
  S.s = stages.length; S.playing = false; setPlay();
  $("scrub").max = stages.length;

  // shadow camera and light scale with the piece
  const r = Math.max(size[0], size[1]) / 1000 * 0.8 + 0.4;
  Object.assign(sun.shadow.camera, { left: -r, right: r, top: r, bottom: -r, near: 0.2, far: 14 });
  sun.shadow.camera.updateProjectionMatrix();

  $("marks").innerHTML = "";
  $("marks").style.gridTemplateColumns = `repeat(${stages.length}, 1fr)`;
  stages.forEach((st, i) => {
    const el = document.createElement("span");
    el.innerHTML = `<b>${String(i + 1).padStart(2, "0")}</b> ${st.en}`;
    el.title = st.ar;
    el.addEventListener("click", () => { S.playing = false; setPlay(); tween("s", i + 1); });
    $("marks").appendChild(el);
  });
  $("sPieces").textContent = pieces.length;
  $("sSize").textContent = size.slice(0, 3).map(Math.round).join("×");
  $("sKind").textContent = `${meta.kind} · الهندسة نفسها تاع ملفات القص`;
  $("pick").innerHTML = `<span class="hint">اضغط على أي قطعة باش تشوف اسمها</span>`;
  [...$("models").children].forEach((b) => b.setAttribute("aria-current", b.dataset.key === key));
  const canX = !!uph || meta.ghost != null;
  $("mXray").disabled = !canX;
  $("mXray").style.opacity = canX ? 1 : 0.4;
  view("hero", true);
  $("loading").hidden = true;
}

// ---------------------------------------------------------------- per-frame build state
function applyBuild() {
  if (!M) return;
  const H = M.size[2], L = Math.max(M.size[0], M.size[1]);
  const nst = M.meta.stages.length;
  const fin = M.hasUph ? Math.min(Math.max(S.s - nst, 0), 1) : 0;
  const ghost = S.xray || S.section;
  const hideFrame = fin > 0.98 && !ghost && S.explode < 0.05;   // the frame stays inside the closed upholstery
  let placed = 0;
  for (const m of M.pieces) {
    const { p, f } = m.userData;
    const t = (S.s - p.stage - f * 0.6) / 0.4;
    m.visible = t > 0 && !hideFrame;
    const k = 1 - ease(t);
    const dist = Math.abs(p.travel[2]) > 0.5 ? H * 0.9 + 200 : L * 0.35 + 200;
    m.position.set(-p.travel[0] * dist * k, -p.travel[1] * dist * k, -p.travel[2] * dist * k + p.stage * H * 0.45 * S.explode);
    const skin = !M.hasUph && S.xray && M.meta.ghost === p.stage;   // x-ray through the cone's shell
    m.material = m === S.pick ? picked : (t > 0 && t < 1.15 ? hot : (skin ? ghostWood : wood));
    if (t >= 1) placed++;
  }
  M.shells.visible = fin > 0.001 && S.explode < 0.05;
  for (const f of fabric) { f.opacity = (ghost ? 0.22 : 1) * ease(fin); f.depthWrite = !ghost && fin > 0.99; }
  const st = Math.min(Math.floor(S.s), M.stages.length - 1);
  const stg = M.stages[Math.max(st, 0)];
  $("stStep").textContent = `${M.meta.name.toUpperCase()} · STEP ${String(st + 1).padStart(2, "0")} / ${String(M.stages.length).padStart(2, "0")} · ${stg.en}`;
  $("stTitle").textContent = stg.ar;
  $("stText").textContent = stg.text;
  $("sPlaced").textContent = placed;
  [...$("marks").children].forEach((el, i) => el.classList.toggle("on", i <= st));
  for (const a of M.anns) a.o.visible = S.labels && S.s >= a.stage + 0.6 && !(fin > 0.5 && !ghost);
  M.dims.visible = S.dims;
  $("scrub").value = S.s;
}

// ---------------------------------------------------------------- camera
function heroView() {
  const a = innerWidth / innerHeight, vf = THREE.MathUtils.degToRad(38);
  const hf = 2 * Math.atan(Math.tan(vf / 2) * a);
  const w = (M ? Math.max(M.size[0], M.size[1] * 0.8) : 3000) / 1000 + 0.4;
  const h = (M ? M.size[2] : 800) / 1000 + 0.3;
  const need = Math.max(w / 2 / Math.tan(hf / 2), h / 2 / Math.tan(vf / 2) * 1.6);
  const dir = new THREE.Vector3(-1.6, 1.3, 3.9).normalize();
  const at = new THREE.Vector3(innerWidth >= 760 ? w * 0.13 : 0, h * 0.38, 0);
  return { pos: dir.multiplyScalar(need * (innerWidth >= 760 ? 1.5 : 1.08)).add(at), at };
}
let camTween = null;
function view(name, instant) {
  let v = heroView();
  if (name === "top") v = { pos: new THREE.Vector3(0, v.pos.length() * 1.05, 0.01), at: new THREE.Vector3(0, 0, 0) };
  if (instant) { camera.position.copy(v.pos); controls.target.copy(v.at); camTween = null; return; }
  camTween = { t: 0, from: camera.position.clone(), to: v.pos, af: controls.target.clone(), at: v.at };
}
const tweens = {};
function tween(key, to, dur = 0.9) { tweens[key] = { from: S[key], to, t: 0, dur }; }

// ---------------------------------------------------------------- controls
const toggle = (id, key, fn) => $(id).addEventListener("click", () => {
  S[key] = !S[key]; $(id).setAttribute("aria-pressed", S[key]); fn?.(S[key]);
});
$("mHero").addEventListener("click", () => view("hero"));
$("mTop").addEventListener("click", () => view("top"));
toggle("mExplode", "explodeOn", (on) => tween("explode", on ? 1 : 0));
toggle("mXray", "xray", (on) => { if (on && M && S.s < M.stages.length) tween("s", M.stages.length); });
toggle("mLabels", "labels");
toggle("mDims", "dims");
toggle("mSection", "section", (on) => {
  clip.length = 0; if (on) clip.push(section);
  allMats.forEach((m) => (m.needsUpdate = true));
  $("sectionCtl").hidden = !on;
});
toggle("mDusk", "dusk", () => applyLook());
$("scrub").addEventListener("input", (e) => { S.playing = false; delete tweens.s; S.s = +e.target.value; setPlay(); });
function setPlay() { $("play").textContent = S.playing ? "❚❚" : "▶"; $("play").setAttribute("aria-label", S.playing ? "أوقف" : "شغّل التركيب"); }
$("play").addEventListener("click", () => {
  if (!M) return;
  if (!S.playing && S.s >= M.stages.length - 0.01) S.s = 0;
  S.playing = !S.playing; setPlay();
});

// picking
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2();
let down = null;
renderer.domElement.addEventListener("pointerdown", (e) => (down = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!M || !down || Math.hypot(e.clientX - down[0], e.clientY - down[1]) > 6) return;
  ndc.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ndc, camera);
  const hit = ray.intersectObjects(M.pieces.filter((m) => m.visible), false)
    .find((h) => !S.section || section.distanceToPoint(h.point) > 0);
  S.pick = hit ? hit.object : null;
  if (S.pick) {
    const p = S.pick.userData.p, st = M.meta.stages[p.stage];
    const el = $("pick"); el.innerHTML = "";
    const a = document.createElement("div"); a.className = "id"; a.textContent = p.label;
    const b = document.createElement("div"); b.className = "hint"; b.textContent = `${st.ar} · ${st.en}`;
    el.append(a, b);
  } else $("pick").innerHTML = `<span class="hint">اضغط على أي قطعة باش تشوف اسمها</span>`;
});

// model tabs
const index = await (await fetch("models/index.json")).json();
for (const m of index) {
  const b = document.createElement("button");
  b.className = "model"; b.type = "button"; b.dataset.key = m.key; b.textContent = m.ar;
  b.addEventListener("click", () => { if (!M || M.key !== m.key) { history.replaceState(null, "", `#${m.key}`); loadModel(m.key); } });
  $("models").appendChild(b);
}

// ---------------------------------------------------------------- look
function applyLook() {
  const th = document.documentElement.dataset.theme;
  const dark = th === "dark" || (th !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
  const bg = new THREE.Color(S.dusk ? "#1d1a24" : (css("--bg") || "#e4e7e8"));
  scene.background = bg;
  floor.material.color.copy(S.dusk ? new THREE.Color("#2b2730") : bg.clone().multiplyScalar(dark ? 1.25 : 0.93));
  hemi.intensity = S.dusk ? 0.35 : (dark ? 0.8 : 1.1);
  hemi.color.set(S.dusk ? 0x6a6fa8 : 0xffffff);
  sun.color.set(S.dusk ? 0xffa060 : 0xffffff);
  sun.intensity = S.dusk ? 3.2 : 2.4;
  sun.position.set(S.dusk ? 4.5 : 2.5, S.dusk ? 1.3 : 4.2, S.dusk ? 1.5 : 3.2);
  fill.intensity = S.dusk ? 0.25 : 0.6;
  hot.color.set(css("--accent") || "#c4562a");
}
applyLook();
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", applyLook);
new MutationObserver(applyLook).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});

// ---------------------------------------------------------------- loop
const clock = new THREE.Clock();
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), 0.05);
  if (S.playing && M) { S.s = Math.min(S.s + dt * 0.55, M.stages.length); if (S.s >= M.stages.length) { S.playing = false; setPlay(); } }
  for (const k in tweens) {
    const tw = tweens[k]; tw.t += dt / (reduce ? 0.01 : tw.dur);
    S[k] = THREE.MathUtils.lerp(tw.from, tw.to, ease(tw.t)); if (tw.t >= 1) delete tweens[k];
  }
  if (camTween) {
    camTween.t += dt / (reduce ? 0.01 : 1.1); const e = ease(camTween.t);
    camera.position.lerpVectors(camTween.from, camTween.to, e); controls.target.lerpVectors(camTween.af, camTween.at, e);
    if (camTween.t >= 1) camTween = null;
  }
  if (S.section) {   // the cut faces the camera; the slider moves it front to back
    const dir = new THREE.Vector3().subVectors(controls.target, camera.position).setY(0).normalize();
    const span = M ? Math.max(M.size[0], M.size[1]) / 2000 : 0.6;
    const c = THREE.MathUtils.lerp(-span, span, +$("secPos").value);
    section.normal.copy(dir); section.constant = -(c + dir.dot(controls.target));
  }
  applyBuild();
  controls.update();
  renderer.render(scene, camera);
  labels.render(scene, camera);
});

addEventListener("hashchange", () => {
  const k = location.hash.slice(1);
  if (index.some((m) => m.key === k) && (!M || M.key !== k)) loadModel(k);
});
const first = location.hash.slice(1);
await loadModel(index.some((m) => m.key === first) ? first : index[0].key);
window.__xray = { S, get M() { return M; }, loadModel };
</script>
